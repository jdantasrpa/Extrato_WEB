<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <defs>
    <marker id="inc" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </marker>
    <marker id="data" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="1010" fill="#0F172A"/>

  <!-- title -->
  <text x="600" y="34" text-anchor="middle" fill="#E2E8F0" font-size="22" font-weight="700">Diagrama de Casos de Uso — Confronto BPO × Extrato (Conciliação)</text>
  <text x="600" y="56" text-anchor="middle" fill="#94A3B8" font-size="13">Aplicação Extrato WEB · cruzamento entre o Arquivo Retorno do BPO e o Extrato bancário</text>

  <!-- system boundary -->
  <rect x="250" y="72" width="745" height="688" rx="14" fill="#111C31" stroke="#334155" stroke-width="1.5"/>
  <text x="622" y="98" text-anchor="middle" fill="#CBD5E1" font-size="14" font-weight="600">Sistema: Extrato WEB — Painel de Conciliação Financeira</text>

  <!-- ============ ASSOCIATIONS (actor <-> use case) ============ -->
  <g stroke="#64748B" stroke-width="1.6" fill="none">
    <line x1="113" y1="126" x2="308" y2="140"/>   <!-- Banco -> A -->
    <line x1="113" y1="274" x2="330" y2="168"/>   <!-- Master -> A -->
    <line x1="116" y1="286" x2="302" y2="288"/>   <!-- Master -> B -->
    <line x1="115" y1="296" x2="356" y2="548"/>   <!-- Master -> G -->
    <line x1="115" y1="304" x2="368" y2="676"/>   <!-- Master -> H -->
    <line x1="113" y1="424" x2="322" y2="306"/>   <!-- BPO -> B -->
    <line x1="113" y1="614" x2="360" y2="576"/>   <!-- AlvoCard -> G -->
    <line x1="1090" y1="620" x2="833" y2="624"/>  <!-- Supabase -> I -->
  </g>

  <!-- ============ DATA-FLOW arrows (the confront inputs) ============ -->
  <g stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#data)">
    <line x1="470" y1="182" x2="546" y2="328"/>   <!-- Extrato -> Confrontar -->
    <line x1="515" y1="306" x2="484" y2="360"/>   <!-- Retorno -> Confrontar -->
  </g>
  <text x="540" y="248" fill="#60A5FA" font-size="11" font-style="italic">alimenta</text>
  <text x="470" y="342" fill="#60A5FA" font-size="11" font-style="italic">alimenta</text>

  <!-- ============ INCLUDE / EXTEND arrows ============ -->
  <g stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="7 5" fill="none" marker-end="url(#inc)">
    <line x1="700" y1="336" x2="768" y2="284"/>   <!-- C -> D -->
    <line x1="746" y1="373" x2="749" y2="375"/>   <!-- C -> E -->
    <line x1="700" y1="410" x2="744" y2="482"/>   <!-- C -> F -->
    <line x1="544" y1="524" x2="566" y2="430"/>   <!-- G -> C -->
    <line x1="470" y1="650" x2="470" y2="604"/>   <!-- H -> G (extend) -->
    <path d="M455,186 Q540,470 618,588"/>          <!-- A -> I include -->
    <path d="M508,322 Q590,460 642,594"/>          <!-- B -> I include -->
  </g>
  <g fill="#94A3B8" font-size="11" font-style="italic">
    <text x="740" y="304">«include»</text>
    <text x="712" y="452">«include»</text>
    <text x="500" y="486">«include»</text>
    <text x="486" y="640">«extend»</text>
    <text x="470" y="430">«include»</text>
    <text x="560" y="520">«include»</text>
  </g>

  <!-- ============ USE CASES ============ -->
  <!-- A Importar Extrato -->
  <ellipse cx="420" cy="150" rx="115" ry="40" fill="#132A45" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="420" y="146" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">Importar Extrato</text>
  <text x="420" y="164" text-anchor="middle" fill="#CBD5E1" font-size="12">Bancário (.xlsx)</text>

  <!-- B Importar Retorno -->
  <ellipse cx="420" cy="290" rx="120" ry="40" fill="#132A45" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="420" y="286" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">Importar Arquivo</text>
  <text x="420" y="304" text-anchor="middle" fill="#CBD5E1" font-size="12">Retorno BPO (.csv)</text>

  <!-- C Confrontar (emphasis) -->
  <ellipse cx="610" cy="375" rx="135" ry="56" fill="#0E3A34" stroke="#2DD4BF" stroke-width="2.4"/>
  <text x="610" y="368" text-anchor="middle" fill="#F0FDFA" font-size="16" font-weight="700">Confrontar</text>
  <text x="610" y="390" text-anchor="middle" fill="#99F6E4" font-size="14" font-weight="600">Retorno × Extrato</text>

  <!-- D Normalizar -->
  <ellipse cx="850" cy="250" rx="105" ry="38" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="850" y="246" text-anchor="middle" fill="#E2E8F0" font-size="13">Normalizar</text>
  <text x="850" y="264" text-anchor="middle" fill="#CBD5E1" font-size="12">Convênio</text>

  <!-- E Defasagem -->
  <ellipse cx="860" cy="375" rx="110" ry="42" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="860" y="370" text-anchor="middle" fill="#E2E8F0" font-size="13">Aplicar Defasagem</text>
  <text x="860" y="388" text-anchor="middle" fill="#CBD5E1" font-size="12">de Competência (+1 mês)</text>

  <!-- F Classificar -->
  <ellipse cx="850" cy="495" rx="110" ry="40" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="850" y="490" text-anchor="middle" fill="#E2E8F0" font-size="13">Classificar Status</text>
  <text x="850" y="508" text-anchor="middle" fill="#CBD5E1" font-size="12">da Conciliação</text>

  <!-- G Visualizar -->
  <ellipse cx="470" cy="560" rx="120" ry="42" fill="#132A45" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="470" y="555" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">Visualizar Conciliação</text>
  <text x="470" y="573" text-anchor="middle" fill="#CBD5E1" font-size="12">(Dashboard e Tabela)</text>

  <!-- H Exportar -->
  <ellipse cx="470" cy="690" rx="110" ry="40" fill="#132A45" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="470" y="686" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">Exportar Conciliação</text>
  <text x="470" y="704" text-anchor="middle" fill="#CBD5E1" font-size="12">(Excel)</text>

  <!-- I Sincronizar -->
  <ellipse cx="720" cy="620" rx="115" ry="42" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="720" y="615" text-anchor="middle" fill="#E2E8F0" font-size="13">Sincronizar Dados</text>
  <text x="720" y="633" text-anchor="middle" fill="#CBD5E1" font-size="12">(Supabase)</text>

  <!-- ============ ACTORS ============ -->
  <!-- Banco -->
  <g transform="translate(95,120)" stroke="#93C5FD" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="0" y1="13" x2="0" y2="44"/>
    <line x1="-17" y1="24" x2="17" y2="24"/>
    <line x1="0" y1="44" x2="-14" y2="66"/>
    <line x1="0" y1="44" x2="14" y2="66"/>
  </g>
  <text x="95" y="206" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Banco</text>
  <text x="95" y="222" text-anchor="middle" fill="#94A3B8" font-size="11">(fonte do Extrato)</text>

  <!-- Master -->
  <g transform="translate(95,280)" stroke="#93C5FD" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="0" y1="13" x2="0" y2="44"/>
    <line x1="-17" y1="24" x2="17" y2="24"/>
    <line x1="0" y1="44" x2="-14" y2="66"/>
    <line x1="0" y1="44" x2="14" y2="66"/>
  </g>
  <text x="95" y="366" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Master</text>
  <text x="95" y="382" text-anchor="middle" fill="#94A3B8" font-size="11">(importa e opera)</text>

  <!-- BPO -->
  <g transform="translate(95,430)" stroke="#93C5FD" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="0" y1="13" x2="0" y2="44"/>
    <line x1="-17" y1="24" x2="17" y2="24"/>
    <line x1="0" y1="44" x2="-14" y2="66"/>
    <line x1="0" y1="44" x2="14" y2="66"/>
  </g>
  <text x="95" y="516" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">BPO</text>
  <text x="95" y="532" text-anchor="middle" fill="#94A3B8" font-size="11">(fonte do Retorno)</text>

  <!-- AlvoCard -->
  <g transform="translate(95,620)" stroke="#93C5FD" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="0" y1="13" x2="0" y2="44"/>
    <line x1="-17" y1="24" x2="17" y2="24"/>
    <line x1="0" y1="44" x2="-14" y2="66"/>
    <line x1="0" y1="44" x2="14" y2="66"/>
  </g>
  <text x="95" y="706" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">AlvoCard</text>
  <text x="95" y="722" text-anchor="middle" fill="#94A3B8" font-size="11">(Visualizador)</text>

  <!-- Supabase -->
  <g transform="translate(1105,620)" stroke="#93C5FD" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="0" y1="13" x2="0" y2="44"/>
    <line x1="-17" y1="24" x2="17" y2="24"/>
    <line x1="0" y1="44" x2="-14" y2="66"/>
    <line x1="0" y1="44" x2="14" y2="66"/>
  </g>
  <text x="1105" y="706" text-anchor="middle" fill="#CBD5E1" font-size="13" font-weight="600">Supabase</text>
  <text x="1105" y="722" text-anchor="middle" fill="#94A3B8" font-size="11">(persistência)</text>

  <!-- ============ LEGEND: rules of the confront ============ -->
  <rect x="60" y="788" width="1080" height="196" rx="12" fill="#111C31" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="818" fill="#2DD4BF" font-size="15" font-weight="700">Regras do Confronto (função computeConciliacao)</text>
  <g fill="#CBD5E1" font-size="14">
    <text x="80" y="848">• <tspan fill="#93C5FD" font-weight="600">Chave de cruzamento:</tspan> convênio normalizado (sem acento, minúsculas, espaços colapsados) + mês.</text>
    <text x="80" y="876">• <tspan fill="#93C5FD" font-weight="600">Defasagem de competência:</tspan> o Retorno (BPO) é comparado com o mês SEGUINTE do Extrato — ex.: abr/26 → 05/2026.</text>
    <text x="80" y="904">• <tspan fill="#93C5FD" font-weight="600">Base do Extrato:</tspan> apenas créditos (natureza “C”) do originador “Vem Benefícios” — única origem cruzada com o BPO.</text>
    <text x="80" y="932">• <tspan fill="#93C5FD" font-weight="600">Diferença</tspan> = crédito do Extrato − valor descontado no Retorno (BPO).</text>
    <text x="80" y="960">• <tspan fill="#93C5FD" font-weight="600">Status:</tspan> Conciliado (|dif| &lt; R$ 0,01) · a maior / a menor (dentro de ±5%) · Divergente (&gt; 5%) · Sem Extrato · Sem Retorno.</text>
  </g>
</svg>
